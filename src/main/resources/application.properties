spring.application.name=library-lending-system
server.port=8000

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

app.seed.librarian.name=Head Librarian
app.seed.librarian.email=${LIBRARIAN_EMAIL:librarian@library.com}
app.seed.librarian.password=${LIBRARIAN_PASSWORD:Librarian@123}
